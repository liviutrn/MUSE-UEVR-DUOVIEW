name: Build52 shading parity, foreground MPC and safe mode transitions Windows DLL
# Exact per-role frame binding; original backend/SDK/frontend pins.
run-name: ID7 QuadViews compiled Windows DLL (${{ github.run_number }})
on:
  push:
    branches: [build/id7-build52-foreground-mpc-20261023]
    paths: ['.github/workflows/id7-build52-shading-transitions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build52-shading-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  quadview-stereo-output:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: liviutrn/UEVR-Quad-Views-Mono
          ref: a64f44de9c9b1229ea6a894150bf375fa15adfb5
          path: workspace
          fetch-depth: 0
          persist-credentials: false
      - name: Verify preserved DuoView baseline against pinned ID7 parent
        shell: pwsh
        run: |
          $baseline='f0a6be707d1c03f2b6c6bf01982f001aa403e073'
          git -C workspace merge-base --is-ancestor $baseline HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Experimental ID7 is not descended from its pinned original source' }
          git -C workspace diff --exit-code $baseline HEAD -- duoview scripts/verify_baseline.py BASELINE_SOURCE_SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw 'Pinned DuoView baseline or integrity verifier changed' }
          Write-Host 'Preserved DuoView source is identical to pinned original ID7 parent'
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/UEVR
          ref: 5ac7edc207866569334175e4ed8a7517971547f6
          fetch-depth: 1
          path: backend
          persist-credentials: false
      - name: Require the SDK source credential
        shell: pwsh
        env:
          SDK_SOURCE_TOKEN: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SDK_SOURCE_TOKEN)) {
            throw 'Add the repository Actions secret UEVR_SOURCE_TOKEN using a token from your Epic-authorized GitHub account; the default repository token cannot access this SDK.'
          }
          'Configured SDK source credential detected; access will be checked against the exact original repository.'
      - name: Check out the original restricted SDK at the exact gitlink
        uses: actions/checkout@v4
        with:
          repository: joeyhodge/UESDK
          ref: 3cffbc82429b6165ceec2714f0f0d9ae48f55596
          token: ${{ secrets.UEVR_SOURCE_TOKEN || secrets.PAT_TOKEN }}
          path: backend/dependencies/submodules/UESDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joeyhodge/uevr-frontend
          ref: 60be4b0f9a646109fd9fdf448bacd41477234091
          path: frontend
          persist-credentials: false
      - name: Verify the unchanged exact source and public dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule update --init --depth 1 -- dependencies/submodules/glm dependencies/submodules/imgui dependencies/submodules/spdlog
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public submodule checkout failed' }
          python workspace/duoview/clean_restart/verify_exact_baseline.py workspace/duoview/clean_restart/baseline.lock.json backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Exact source identity or completeness verification failed' }
      - name: Apply exact-anchor Stage 1 fallback patch
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply guarded DuoView Stage 1 edits' }
          python workspace/duoview/joey_stage1/verify_stage1.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected source changes in DuoView Stage 1' }
      - name: Apply Native Stereo Fix backed DuoView source changes
        shell: pwsh
        run: |
          python workspace/duoview/joey_stage1/apply_stage234.py backend frontend workspace/duoview
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2-4 source anchors did not match original Joey' }
          python workspace/duoview/joey_stage1/verify_stage234.py backend frontend evidence
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2-4 violated original-source or SDK boundaries' }
      - name: Apply isolated stereo QuadView backend overlay
        shell: pwsh
        run: |
          python workspace/quadview/apply_quadviews.py backend frontend workspace/quadview
          if ($LASTEXITCODE -ne 0) { throw 'QuadView guarded source overlay failed' }
          python workspace/quadview/apply_quadview_consumer.py backend
          if ($LASTEXITCODE -ne 0) { throw 'QuadView consumer source overlay failed' }
          python workspace/quadview/apply_quadview_native_delivery.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Four-source Native Stereo Fix delivery overlay failed' }
          python workspace/quadview/apply_quadview_native_retirement.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Fenced native target retirement overlay failed' }
          python workspace/quadview/apply_quadview_recovery.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Engine-only bootstrap/shared-tail recovery overlay failed' }
          python workspace/quadview/apply_quadview_role_frames.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Exact singleton frame binding overlay failed' }
          python workspace/quadview/apply_quadview_hook_trace.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Hook trace overlay failed' }
          python workspace/quadview/apply_quadview_hook_output_trace.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Hook output trace overlay failed' }
          python workspace/quadview/apply_quadview_present_setup.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Presentation retirement scope patch failed' }
          python workspace/quadview/apply_quadview_target_lifetime.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Engine-owned native target lifetime patch failed' }
          python workspace/quadview/apply_quadview_foreground_mpc.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Conditional foreground MPC patch failed' }
          python workspace/quadview/apply_quadview_transitions.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Guarded mode transition patch failed' }
          python workspace/quadview/apply_quadview_shading.py backend
          if ($LASTEXITCODE -ne 0) { throw 'Consistent initial source shading pass patch failed' }
          python workspace/quadview/embed_shader.py backend/src/mods/vr/QuadViewShaderBytecode.hpp
          if ($LASTEXITCODE -ne 0) { throw 'QuadView offline shader compilation failed' }
          python workspace/quadview/SourceCheckpointTests.py
          if ($LASTEXITCODE -ne 0) { throw 'QuadView source checkpoint regression tests failed' }
          python workspace/quadview/source_checkpoint.py capture backend frontend evidence/quadview-source.json
          if ($LASTEXITCODE -ne 0) { throw 'QuadView source checkpoint failed' }
      - name: Test QuadView contracts, asynchronous delivery, and production GPU compositor
        shell: pwsh
        run: |
          cmake -S workspace/quadview -B quad_tests -G 'Visual Studio 17 2022' -A x64 -DQUADVIEW_REQUIRE_DUOVIEW_TESTS=ON "-DQUADVIEW_BACKEND_DIR=$((Resolve-Path backend).Path)" *> evidence/quad-configure.log
          $code=$LASTEXITCODE; Get-Content evidence/quad-configure.log | Select-Object -Last 40
          if ($code -ne 0) { throw 'QuadView tests configuration failed' }
          cmake --build quad_tests --config Release --parallel 2 *> evidence/quad-build.log
          $code=$LASTEXITCODE; Get-Content evidence/quad-build.log | Select-Object -Last 80
          if ($code -ne 0) { throw 'QuadView tests compilation failed' }
          ctest --test-dir quad_tests -C Release --verbose --output-on-failure --no-tests=error *> evidence/quad-results.log
          $code=$LASTEXITCODE; Get-Content evidence/quad-results.log
          if ($code -ne 0) { throw 'QuadView CPU/asynchronous/GPU tests failed' }
      - name: Verify pinned production geometry and pair-state contracts
        shell: pwsh
        run: |
          cmake -S workspace/duoview/joey_stage1 -B duo_pinned_tests -G 'Visual Studio 17 2022' -A x64 "-DJOYEY_BACKEND_DIR=$((Resolve-Path backend).Path)" *> evidence/pinned-config.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-config.log | Select-Object -Last 40
          if ($code -ne 0) { throw "Pinned production test configuration failed ($code)" }
          cmake --build duo_pinned_tests --config Release --parallel 2 *> evidence/pinned-build.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-build.log | Select-Object -Last 80
          if ($code -ne 0) { throw "Pinned production tests failed compilation ($code)" }
          ctest --test-dir duo_pinned_tests -C Release --output-on-failure --no-tests=error *> evidence/pinned-results.log
          $code=$LASTEXITCODE; Get-Content evidence/pinned-results.log
          if ($code -ne 0) { throw "Pinned production contract failed ($code)" }
      - name: Configure independent DuoView geometric, state, and GPU WARP tests
        shell: pwsh
        run: |
          cmake -S workspace/duoview -B duo_tests -G 'Visual Studio 17 2022' -A x64 *> evidence/duo-configure.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-configure.log | Select-Object -Last 50
          if ($code -ne 0) { throw "DuoView independent tests configuration failed ($code)" }
          cmake --build duo_tests --config Release --parallel 2 *> evidence/duo-test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "DuoView independent tests failed compilation ($code)" }
          ctest --test-dir duo_tests -C Release --output-on-failure --no-tests=error *> evidence/duo-test-results.log
          $code=$LASTEXITCODE; Get-Content evidence/duo-test-results.log
          if ($code -ne 0) { throw "DuoView independent CPU/GPU tests failed ($code)" }
      - name: Configure original compatibility tests and production backend
        shell: pwsh
        run: |
          cmake -S backend -B backend/build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release -DUEVR_BUILD_COMPATIBILITY_TESTS=ON *> evidence/configure.log
          $code=$LASTEXITCODE; Get-Content evidence/configure.log | Select-Object -Last 60
          if ($code -ne 0) { throw "Original Joey configuration failed ($code)" }
      - name: Build original backend and auxiliary DLLs
        id: build_backend
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --target uevr vr-plugin-nullifier LuaVR --parallel 2 *> evidence/backend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/backend-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Original latest Joey backend failed to compile ($code)" }
      - name: Build every test target used by the official matching build
        shell: pwsh
        run: |
          cmake --build backend/build --config Release --parallel 2 --target compatibility-policy-tests steam-frame-input-tests stock-frame-migration-tests gamepad-recovery-tests kananlib-decode-window-tests diagnostic-safety-tests prospi-camera-trace-tests prospi-camera-framing-tests prospi-celebration-framing-tests prospi-roof-visibility-tests hifi-hook-memory-tests nascar-hook-compatibility-tests input-hook-installation-tests mono-d3d11-tests mono-d3d12-tests ui-alpha-tests ui-alpha-lifecycle-tests ui-composition-tests lua-fname-binding-tests lua-context-dispatch-tests lua-controller-input-tests stalker2-native-policy-tests stalker2-native-d3d12-tests *> evidence/test-build.log
          $code=$LASTEXITCODE; Get-Content evidence/test-build.log | Select-Object -Last 100
          if ($code -ne 0) { throw "Original compatibility tests failed to compile ($code)" }
      - name: Run the complete original compatibility suite
        shell: pwsh
        run: |
          ctest --test-dir backend/build -C Release --output-on-failure --no-tests=error *> evidence/compatibility-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/compatibility-tests.log
          if ($code -ne 0) { throw "Original compatibility tests failed ($code)" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Test and build matching original frontend
        id: build_frontend
        shell: pwsh
        run: |
          dotnet run --project frontend/tests/RenderingModes --configuration Release *> evidence/frontend-tests.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-tests.log
          if ($code -ne 0) { throw 'Original rendering-ID tests failed' }
          dotnet publish frontend/UEVR/UEVR.csproj --output package --configuration Release *> evidence/frontend-build.log
          $code=$LASTEXITCODE; Get-Content evidence/frontend-build.log | Select-Object -Last 60
          if ($code -ne 0) { throw 'Matching original frontend failed to compile' }
      - name: Verify final QuadView source identity and package
        shell: pwsh
        run: |
          python workspace/quadview/source_checkpoint.py verify backend frontend evidence/quadview-source.json
          if ($LASTEXITCODE -ne 0) { throw 'QuadView source changed during the build' }
          Copy-Item backend/build/bin/uevr/*.dll package/
          Copy-Item backend/build/bin/vr-plugin-nullifier/UEVRPluginNullifier.dll package/
          Copy-Item backend/build/bin/LuaVR/LuaVR.dll package/
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json package/
          Copy-Item evidence/exact-baseline-source.json package/
          Copy-Item evidence/duoview-stage1-edits.json package/
          Copy-Item evidence/duoview-stage1-source-hashes.json package/
          Copy-Item evidence/duoview-stage234-hashes.json package/
          Copy-Item workspace/quadview/READ_FIRST.txt package/READ_FIRST.txt
          Copy-Item workspace/quadview/README.md package/QUADVIEW_README.md
          Copy-Item workspace/quadview/RELEASE_NOTES.md package/QUADVIEW_RELEASE_NOTES.md
          Copy-Item workspace/quadview/GLAMARYE_LICENSE.txt package/GLAMARYE_LICENSE.txt
          Copy-Item evidence/quadview-source.json package/
          Copy-Item evidence/quadview-source-generated.json package/
          Copy-Item workspace/quadview/BUILD46_FINDINGS_STATUS.md package/BUILD46_FINDINGS_STATUS.md
          Copy-Item workspace/quadview/BUILD48_FINDINGS_STATUS.md package/BUILD48_FINDINGS_STATUS.md
          Copy-Item workspace/quadview/BUILD49_FINDINGS_STATUS.md package/BUILD49_FINDINGS_STATUS.md
          Copy-Item workspace/quadview/BUILD50_FINDINGS_STATUS.md package/
          Copy-Item workspace/quadview/BUILD51_FINDINGS_STATUS.md package/
          Copy-Item workspace/quadview/BUILD52_FINDINGS_STATUS.md package/
          Copy-Item workspace/quadview/BUILD51_USER_LOG_ANALYSIS_2026-10-23.md package/
          Copy-Item workspace/quadview/quadview_hook_trace_summary.py package/
          Copy-Item workspace/quadview/quadview_log_regression.py package/quadview_log_regression.py
          Copy-Item workspace/quadview/FUTURE_LUNA_REVIEW.md package/FUTURE_LUNA_REVIEW.md
          Copy-Item workspace/quadview/FUTURE_SOL61_REVIEW.md package/FUTURE_SOL61_REVIEW.md
          Copy-Item workspace/quadview/PERFORMANCE_AND_ADAPTIVE_FPS_PLAN.md package/PERFORMANCE_AND_ADAPTIVE_FPS_PLAN.md
          @{ build='52'; diagnosticOnly=$true; baseline='User-confirmed Build51; four native sources and Build40 geometry lineage'; baselineSource='f4e086cde6d4a183cf2c1223dd9effaf6f8f7a77'; overlay=(git -C workspace rev-parse HEAD).Trim(); run=$env:GITHUB_RUN_ID; mode='ID7 initial shading pass parity; conditional foreground MPC; guarded transitions; CPU timing; headset test candidate'; headsetVerified=$false } | ConvertTo-Json | Set-Content package/QUADVIEW_BUILD.json
          $pdb=Get-ChildItem backend/build -Recurse -Filter UEVRBackend.pdb | Select-Object -First 1
          if (!$pdb) { throw 'Missing exact backend debug symbols' }
          @{ overlay=(git -C workspace rev-parse HEAD).Trim(); backend='5ac7edc207866569334175e4ed8a7517971547f6'; sdk='3cffbc82429b6165ceec2714f0f0d9ae48f55596'; binarySha256=(Get-FileHash package/UEVRBackend.dll -Algorithm SHA256).Hash; pdbSha256=(Get-FileHash $pdb.FullName -Algorithm SHA256).Hash; workflow=$env:GITHUB_SHA } | ConvertTo-Json | Set-Content package/BUILD52_BINARY_IDENTITY.json
          @'
          Build52 - Quad Views Stereo ID7 - shading / first-person / transitions test candidate
          Start a fresh game process and inject the entire package.
          First compare left/right context and focus shading in the same scene.
          Consistent source shading pass is ON by default; OFF restores Build51 pass classification.
          Verify binocular stereo, FOV and gaze. First-person FOV parity is also ON by default.
          Test 7->6->7, 7->5->7, 7->0->7, other available modes, rapid requests/cancel, loading and runtime reset.
          All real CPU ownership and GPU fence gates are retained. A freeze fix still requires headset confirmation.
          Enable QuadView GPU timing to also log opt-in native dispatch CPU average/max (not whole game time).
          Keep settings/resolution fixed when comparing performance; no FPS improvement is claimed.
          Read BUILD52_FINDINGS_STATUS.md and BUILD51_USER_LOG_ANALYSIS_2026-10-23.md for evidence and limits.
          Keep Build51 as the user-confirmed fallback. This new build is not yet headset-verified.
          Send the complete UEVR log, QUADVIEW_BUILD.json and BUILD52_BINARY_IDENTITY.json if a problem occurs.
          Exact backend PDB and DLL artifacts are retained with this CI run.
          '@ | Set-Content package/READ_FIRST.txt
          $needed=@('BUILD52_BINARY_IDENTITY.json','BUILD52_FINDINGS_STATUS.md','BUILD51_USER_LOG_ANALYSIS_2026-10-23.md','BUILD50_FINDINGS_STATUS.md','quadview_hook_trace_summary.py','UEVRBackend.dll','UEVRPluginNullifier.dll','LuaVR.dll','READ_FIRST.txt','QUADVIEW_RELEASE_NOTES.md','GLAMARYE_LICENSE.txt','BUILD46_FINDINGS_STATUS.md','BUILD48_FINDINGS_STATUS.md','quadview_log_regression.py','FUTURE_LUNA_REVIEW.md','FUTURE_SOL61_REVIEW.md','PERFORMANCE_AND_ADAPTIVE_FPS_PLAN.md','duoview-stage234-hashes.json','exact-baseline-source.json','quadview-source.json','quadview-source-generated.json','QUADVIEW_BUILD.json')
          foreach ($name in $needed) { if (!(Test-Path ("package/" + $name))) { throw "Missing critical package file: $name" } }
          if (@(Get-ChildItem package -File -Filter *.exe).Count -lt 1) { throw "Missing Joey frontend executable" }
          if ((Get-Content package/READ_FIRST.txt -Raw) -notmatch 'ID7') { throw 'Missing stereo QuadView instructions' }
          Get-ChildItem package -Recurse -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content evidence/package-sha256.json
          $zip="UEVR-QuadViews-Build52-NativeStereoFix-${{ github.run_number }}.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UEVR-QuadViews-ID7-Build52-Compiled-${{ github.run_number }}
          path: |
            UEVR-QuadViews-Build52-NativeStereoFix-*.zip
            UEVR-QuadViews-Build52-NativeStereoFix-*.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: steps.build_backend.outcome == 'success'
        with:
          name: QuadView-Build52-Exact-Backend-Symbols
          path: |
            backend/build/**/UEVRBackend.pdb
            backend/build/**/UEVRBackend.dll
          if-no-files-found: error
          retention-days: 90
      - name: Preserve compiled outputs if packaging fails
        if: failure() && steps.build_backend.outcome == 'success' && steps.build_frontend.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: QuadView-Build52-Compiled-Debug-${{ github.run_number }}
          path: |
            backend/build/bin/uevr/*.dll
            backend/build/bin/vr-plugin-nullifier/*.dll
            backend/build/bin/LuaVR/*.dll
            package/
            evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Record public source and dependency provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          git -C backend submodule status | Set-Content evidence/submodules.txt
          Copy-Item workspace/duoview/clean_restart/baseline.lock.json evidence/
          Copy-Item backend/build/Testing/Temporary/LastTest.log evidence/ -ErrorAction SilentlyContinue
          $global:LASTEXITCODE=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuadView-Build52-Stereo-Evidence-${{ github.run_number }}
          path: evidence/
          if-no-files-found: error


  portable-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: liviutrn/UEVR-Quad-Views-Mono
          ref: a64f44de9c9b1229ea6a894150bf375fa15adfb5
          persist-credentials: false
      - name: Run production-header recovery and ownership tests with ASan and UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          set -euo pipefail
          mkdir -p sanitizer-evidence
          for test in ForegroundMPCTests PrimaryPassTests RetirementScopeTests HookTraceGateTests NativeRenderTraceTests NativeRoleFrameTests EngineRegistrationDiagnosticsTests RecoveryContinuityTests NativeDeliveryTests FamilyRoutingTests ContentProvenancePropertyTests; do
            g++ -std=c++20 -O1 -g -pthread -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer "quadview/$test.cpp" -o "sanitizer-evidence/$test"
            "sanitizer-evidence/$test" > "sanitizer-evidence/$test.log" 2>&1
            cat "sanitizer-evidence/$test.log"
          done
          python3 quadview/NativeRoleFrameMutationTest.py
          python3 quadview/RecoveryMutationTest.py sanitizer-evidence/RecoveryContinuityTests
          python3 -m unittest discover -s quadview -p test_quadview_log_regression.py -v
          python3 -m unittest discover -s quadview -p test_quadview_hook_trace_summary.py -v
          python3 scripts/verify_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuadView-Build52-Sanitizer-Evidence-${{ github.run_number }}
          path: sanitizer-evidence/*.log
          if-no-files-found: error

  # Preserve exact symbols for this binary; future crashes must not depend on reconstruction.
